name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Test index builder
        run: python -m unittest discover tests -v

      - name: Build reports index
        # Not --strict: a malformed report is skipped (and shown as a warning
        # annotation below) so the rest of the archive still deploys.
        run: |
          python scripts/build_index.py 2> warnings.txt || true
          cat warnings.txt
          while IFS= read -r line; do echo "::warning title=Report skipped::${line#warning: skipped }"; done < warnings.txt
          test -f reports/index.json

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js app vendor icons _site/
          mkdir _site/reports
          cp reports/*.md reports/index.json _site/reports/ 2>/dev/null || cp reports/index.json _site/reports/
          # A new cache name on every deploy makes installed apps pick up the new shell.
          sed -i "s/const SHELL_VERSION = '[^']*'/const SHELL_VERSION = '${GITHUB_SHA::8}'/" _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
